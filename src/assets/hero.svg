<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Illustration representing students learning at CIBLE School of Language (not a photograph of actual students)">
  <title>Illustration — Learn English. Build Confidence. Shape Your Future.</title>
  <!-- soft brand backdrop blobs -->
  <circle cx="472" cy="150" r="150" fill="#dbeafe"/>
  <circle cx="150" cy="356" r="120" fill="#dcfce7"/>
  <circle cx="545" cy="360" r="70" fill="#ffedd5"/>
  <!-- decorative dots -->
  <circle cx="86" cy="150" r="8" fill="#f97316"/>
  <circle cx="560" cy="96" r="10" fill="#16a34a"/>
  <circle cx="120" cy="250" r="6" fill="#2563eb"/>
  <circle cx="600" cy="250" r="6" fill="#f97316"/>
  <!-- language speech bubble (top-left) -->
  <g>
    <rect x="96" y="70" width="120" height="82" rx="20" fill="#2563eb"/>
    <path d="M128 148 L128 182 L166 150 Z" fill="#2563eb"/>
    <text x="156" y="128" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Aa</text>
  </g>
  <!-- chat/communication bubble (right) -->
  <g>
    <rect x="470" y="120" width="96" height="66" rx="18" fill="#16a34a"/>
    <path d="M498 182 L498 208 L528 184 Z" fill="#16a34a"/>
    <circle cx="500" cy="153" r="7" fill="#ffffff"/>
    <circle cx="518" cy="153" r="7" fill="#ffffff"/>
    <circle cx="536" cy="153" r="7" fill="#ffffff"/>
  </g>
  <!-- graduation cap (above the book) -->
  <g>
    <path d="M320 214 L390 240 L320 266 L250 240 Z" fill="#0f172a"/>
    <path d="M300 258 L300 286 Q320 300 340 286 L340 258 L320 268 Z" fill="#334155"/>
    <path d="M390 240 L390 286" stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="390" cy="292" r="7" fill="#f97316"/>
    <circle cx="320" cy="243" r="6" fill="#1d4ed8"/>
  </g>
  <!-- open book (center bottom) -->
  <g>
    <path d="M320 318 C 262 306 206 314 182 330 L182 412 C 206 396 262 388 320 400 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M320 318 C 378 306 434 314 458 330 L458 412 C 434 396 378 388 320 400 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M182 412 C 206 396 262 388 320 400 C 378 388 434 396 458 412 L458 424 C 434 408 378 400 320 412 C 262 400 206 408 182 424 Z" fill="#1d4ed8"/>
    <path d="M320 318 L320 400" stroke="#94a3b8" stroke-width="2"/>
    <path d="M212 340 L296 332 M212 356 L296 350 M212 372 L296 366" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/>
    <path d="M344 332 L428 340 M344 350 L428 358 M344 366 L428 374" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- growth bars (bottom-right, progress toward future) -->
  <g>
    <rect x="486" y="392" width="18" height="34" rx="4" fill="#93c5fd"/>
    <rect x="512" y="372" width="18" height="54" rx="4" fill="#3b82f6"/>
    <rect x="538" y="348" width="18" height="78" rx="4" fill="#2563eb"/>
    <path d="M486 356 L520 336 L512 348 M520 336 L516 350" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- pencil accent (diagonal, lower-left) -->
  <g transform="rotate(38 150 420)">
    <rect x="96" y="410" width="96" height="18" rx="3" fill="#f97316"/>
    <rect x="96" y="410" width="14" height="18" fill="#ea580c"/>
    <path d="M192 410 L210 419 L192 428 Z" fill="#fbbf24"/>
    <path d="M205 415.5 L210 419 L205 422.5 Z" fill="#0f172a"/>
