<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <!--
      SEO head is managed PER PAGE by react-helmet-async via the <Seo> component
      (src/components/seo/Seo.jsx): title, description, canonical, Open Graph and
      Twitter tags, plus JSON-LD (src/components/seo/StructuredData.jsx). Those
      route-specific tags are intentionally NOT declared statically here — keeping
      them would produce duplicate/conflicting values (two descriptions, a
      homepage canonical leaking onto inner routes and the 404 view) once Helmet
      injects its own (M01). Only genuine, non-route-specific document defaults
      live below: charset, icon, manifest, viewport (with viewport-fit=cover for
      iOS safe areas — M13), theme-color, and the font links.

      No static <title> is declared here either: react-helmet-async (v3, on
      React 19's native metadata path) APPENDS the per-route <title> it emits
      rather than replacing a pre-existing static one, so declaring a <title>
      here would leave two <title> elements in the head — a duplicate-tag defect
      (M01). The document title is therefore emitted solely per route by <Seo>,
      guaranteeing exactly one correct <title> per page. The tab briefly shows the
      URL before hydration — an acceptable trade-off for this client-rendered SPA
      in exchange for a single, non-duplicated, per-route title.
    -->

    <!-- Fonts: Inter (design-system --font-sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
